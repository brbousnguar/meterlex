name: meterlex

services:
  backend:
    build: ./backend
    container_name: meterlex-backend
    environment:
      DB_PATH: /app/data/meterlex.db
      # The machine the hub's own history came from, before collectors
      # reported per machine: its collector's machine name (see .env.example).
      HUB_MACHINE: ${HUB_MACHINE:-hub}
      # model-prices runs on the host (docker-compose project of its own),
      # not on this container's network — reach it via the host gateway.
      MODEL_PRICES_URL: http://host.docker.internal:8693
    volumes:
      # The database only: collectors on each machine read the session logs
      # and POST their counts to /api/ingest, so no transcript is mounted.
      - ./data:/app/data
    ports:
      - "127.0.0.1:8692:8692"
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: meterlex-frontend
    environment:
      BACKEND_URL: http://backend:8692
      NGINX_ENVSUBST_TEMPLATE_VARS: BACKEND_URL
    ports:
      # loopback only; other machines reach the UI and /api/ingest through
      # `tailscale serve --bg --https=5180 http://127.0.0.1:5180`
      - "127.0.0.1:5180:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes: {}
