name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r backend/requirements-dev.txt
      - run: pytest --cov=backend --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run build

  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Reject committed runtime data and secrets
        shell: bash
        run: |
          ! git ls-files | grep -E '(^|/)(\.env|.*\.db(-shm|-wal)?|node_modules|dist)(/|$)'
          ! git grep -nEI '(BEGIN (RSA|OPENSSH|EC) PRIVATE KEY|api[_-]?key[[:space:]]*[:=])' -- . ':!*.lock'
      - name: Validate Maestro flows
        uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: .maestro
      - name: Validate Docker Compose
        env:
          CLAUDE_CODE_PROJECTS: /tmp/meterlex/claude
          CODEX_SESSIONS: /tmp/meterlex/codex
          AGY_DIR: /tmp/meterlex/agy
          COPILOT_CLI_DIR: /tmp/meterlex/copilot
        run: docker compose config --quiet
