server {
    listen 80;

    location /api/ {
        # collectors POST batches of up to 5,000 usage turns
        client_max_body_size 16m;
        proxy_pass ${BACKEND_URL}/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # The manifest must be served as application/manifest+json or iOS refuses
    # to install; sw.js and index.html must never be cached long, or a phone
    # stays pinned to an old build across reinstalls.
    location = /site.webmanifest {
        root /usr/share/nginx/html;
        types { } default_type application/manifest+json;
        add_header Cache-Control "public, max-age=3600";
    }

    location = /sw.js {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
    }

    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
