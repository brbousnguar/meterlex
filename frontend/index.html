<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Meterlex</title>
    <meta name="description" content="What your coding agents burn: tokens, models, harnesses and machines." />

    <link rel="icon" href="/favicon.ico?v=2" sizes="48x48 32x32 16x16" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
    <link rel="manifest" href="/site.webmanifest?v=2" />

    <!-- The installed app keeps the system status bar: "black-translucent"
         leaves a dead band under a bottom tab bar on iOS. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Meterlex" />
    <!-- Atlas is a light theme: one paper, whatever the system is set to. -->
    <meta name="theme-color" content="#faf6ee" />
    <meta name="color-scheme" content="light" />

    <!-- Type: Fraunces (titles, every number), Inter (reading),
         JetBrains Mono (machine names, model ids, labels). See DESIGN.md. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,400..800,50&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
